# VORLAEUFIGE GPIO-ZUORDNUNG
# Diese Datei ist keine bestaetigte Verdrahtung. Jeder Zahlenwert ist nur ein
# Kandidat und darf nicht als produktive Aktorbelegung verwendet werden.
# Nach Hardwarepruefung als config/pins.yaml uebernehmen und Status je Signal
# aendern.

status: candidate_unconfirmed
board: ESP32-WROOM-32E

reserved:
  status: generic_esp32_constraints_verify_on_board
  uart0_tx: 1
  uart0_rx: 3
  boot_gpio: 0
  avoid_strapping_gpio: [0, 2, 4, 5, 12, 15]

onboard_mosfet_channels:
  status: unverified
  candidate:
    channel_1_gpio: 16
    channel_2_gpio: 17
    channel_3_gpio: 26
    channel_4_gpio: 27

spi_display_touch:
  status: candidate_unconfirmed
  sck_gpio_candidate: 18
  mosi_gpio_candidate: 23
  miso_gpio_candidate: 19
  lcd_cs_gpio_candidate: 32
  lcd_dc_gpio_candidate: 33
  lcd_reset_gpio_unknown: null
  touch_cs_gpio_candidate: 25
  touch_irq_gpio_unknown: null
  backlight: unknown

one_wire:
  status: candidate_unconfirmed
  ds18b20_data_gpio_candidate: 13
  pullup_ohm: 4700
  pullup_to_v: 3.3

bts7960:
  status: candidate_unconfirmed
  rpwm_gpio_candidate: 21
  lpwm_gpio_candidate: 22
  enable_gpio_candidate: 14
  r_enable_and_l_enable_tied: true
  r_is_gpio_unknown: null
  l_is_gpio_unknown: null

validation:
  duplicate_gpio_check_required: true
  verify_exposed_on_physical_board: true
  verify_boot_safe_levels: true
  verify_active_levels: true
