# BEISPIELKONFIGURATION – KEINE BESTAETIGTE VERDRAHTUNG
# Werte mit TBD_HARDWARE oder TBD_COMMISSIONING duerfen nicht als produktive
# Freigabe verwendet werden.

project:
  name: ESP32-Fermentationsschrank
  owner: ManuEngineer
  release_scope: release_1

controller:
  family: esp32
  module: ESP32-32E
  module_status: confirmed_order
  flash_mb: 4
  flash_status: confirmed_order
  require_psram: false
  partition_layout: TBD_IMPLEMENTATION_BUDGET
  profiles:
    native:
      target: host
      actuator_policy: simulation_only
      real_actuators_enabled: false
    esp32_bringup:
      target: esp32dev
      startup_state: HARDWARE_UNVERIFIED
      actuator_policy: locked_for_bringup
      real_actuators_enabled: false
    esp32_release:
      target: esp32dev
      requires_verified_hardware_profile: true
      actuator_policy: require_verified_hardware
      real_actuators_enabled: false

peltier:
  voltage_v: 12
  nominal_power_w: 60
  nominal_current_a: 5
  driver: BTS7960
  reversible: true
  high_frequency_pwm: false
  overcurrent_fuse_a: 7.5
  fuse_type: TBD_HARDWARE
  one_shot_thermal_fuse: true
  thermal_fuse_rating_c: TBD_COMMISSIONING
  thermal_fuse_location: TBD_COMMISSIONING
  ris_lis_usage: verify_on_real_module

sensors:
  conversion_resolution_bit: 12
  nominal_cycle_s: 2
  parasite_power: false
  roles:
    chamber_air:
      type: DS18B20
      required_for_peltier: true
      removable: false
      bus: TBD_HARDWARE
      rom_address: TBD_HARDWARE
    product:
      type: DS18B20
      required_for_peltier: false
      removable: true
      bus: product_external
      connector: TBD_HARDWARE
      rom_address: runtime_or_commissioning
    heatsink:
      type: DS18B20
      required_for_peltier: true
      removable: false
      bus: TBD_HARDWARE
      rom_address: TBD_HARDWARE
  preferred_bus_topology: separate_bus_per_sensor
  minimum_bus_topology: fixed_sensors_shared_product_separate

fans:
  internal:
    voltage_v: 12
    mode: continuous_during_temperature_control
    afterrun_s: TBD_COMMISSIONING
    tachometer: false
  external:
    voltage_v: 12
    intentional_prerun_s: 0
    afterrun_s: TBD_COMMISSIONING
    tachometer: false

buzzer:
  type: active
  voltage_v: TBD_HARDWARE
  driver_channel: TBD_HARDWARE

ui:
  display:
    model: TZT_MSP2807
    width_px: 320
    height_px: 240
    orientation: landscape
    controller: ILI9341
    controller_status: confirmed_order
  touch:
    type: resistive
    controller: TBD_HARDWARE
    candidate_controller: XPT2046
    candidate_status: unverified_order_description
    controller_status: TBD_HARDWARE

power_monitoring:
  esp32_brownout: true
  reset_reason: true
  external_12v_adc:
    enabled: false
    status: FUTURE_RELEASE

features:
  door_contact:
    enabled: false
    status: not_planned_release_1
  rtc:
    required: false
    status: FUTURE_RELEASE
  web_ota:
    enabled: false
    status: FUTURE_RELEASE
  uart_update:
    enabled: true
    adapter: FT232RL
  user_uart_diagnostics:
    enabled: false
    status: FUTURE_RELEASE

hardware_release:
  state: HARDWARE_UNVERIFIED
  pins_confirmed: false
  active_levels_confirmed: false
  boot_levels_confirmed: false
  peltier_pulse_test_passed: false
