# Spezifikationsbeispiel. Exakte Prozesswerte folgen erst bei der Inbetriebnahme.
# TBD_COMMISSIONING ist kein gueltiger Laufzeitwert der fertigen Firmware.
schema_version: 4

programs:
  - id: yogurt-mild
    name: Joghurt mild
    built_in: true
    factory_catalog_entry: true
    resettable: true
    user_deletable: true
    installed: true
    enabled: true
    defaults:
      preheat: true
      sensor_preference: product_if_available_else_air
      product_sensor_failure:
        policy: fallback_to_air_after_timeout
        fallback_delay_s: TBD_COMMISSIONING
      fermentation_temperature_c: TBD_COMMISSIONING
      fermentation_duration_min: TBD_COMMISSIONING
      target_qualification_band_c: TBD_COMMISSIONING
      target_qualification_duration_min: TBD_COMMISSIONING
      max_target_reach_min: TBD_COMMISSIONING
      completion:
        mode: cool_and_hold_until_manual_stop
        cooling_target_c: TBD_COMMISSIONING

  - id: yogurt-firm
    name: Joghurt stichfest
    built_in: true
    factory_catalog_entry: true
    resettable: true
    user_deletable: true
    installed: true
    enabled: true
    defaults:
      preheat: true
      sensor_preference: product_if_available_else_air
      product_sensor_failure:
        policy: fallback_to_air_after_timeout
        fallback_delay_s: TBD_COMMISSIONING
      fermentation_temperature_c: TBD_COMMISSIONING
      fermentation_duration_min: TBD_COMMISSIONING
      target_qualification_band_c: TBD_COMMISSIONING
      target_qualification_duration_min: TBD_COMMISSIONING
      max_target_reach_min: TBD_COMMISSIONING
      completion:
        mode: cool_and_hold_until_manual_stop
        cooling_target_c: TBD_COMMISSIONING

  - id: milk-kefir
    name: Milchkefir
    built_in: true
    factory_catalog_entry: true
    resettable: true
    user_deletable: true
    installed: true
    enabled: true
    defaults:
      preheat: false
      sensor_preference: air_product_optional
      product_sensor_failure:
        policy: fallback_to_air_after_timeout
        fallback_delay_s: TBD_COMMISSIONING
      fermentation_temperature_c: TBD_COMMISSIONING
      fermentation_duration_min: TBD_COMMISSIONING
      target_qualification_band_c: TBD_COMMISSIONING
      target_qualification_duration_min: TBD_COMMISSIONING
      max_target_reach_min: TBD_COMMISSIONING
      completion:
        mode: cool_and_hold_until_manual_stop
        cooling_target_c: TBD_COMMISSIONING

  - id: water-kefir
    name: Wasserkefir
    built_in: true
    factory_catalog_entry: true
    resettable: true
    user_deletable: true
    installed: true
    enabled: true
    defaults:
      preheat: false
      sensor_preference: air_product_optional
      product_sensor_failure:
        policy: fallback_to_air_after_timeout
        fallback_delay_s: TBD_COMMISSIONING
      fermentation_temperature_c: TBD_COMMISSIONING
      fermentation_duration_min: TBD_COMMISSIONING
      target_qualification_band_c: TBD_COMMISSIONING
      target_qualification_duration_min: TBD_COMMISSIONING
      max_target_reach_min: TBD_COMMISSIONING
      completion:
        mode: finish_without_cooling
        cooling_target_c: null

program_management:
  additional_user_programs_allowed: true
  fixed_program_count: false
  list_order:
    - installed_standard_programs
    - user_programs
  per_run_changes_are_persistent: false
  delete_confirmation_steps: 2
  built_in_delete_behavior: remove_active_instance_keep_factory_catalog
  factory_reset_restores_built_in_programs: true
  user_programs_may_be_created_from:
    - empty_template
    - copy_of_standard_program
    - copy_of_user_program

allowed_values:
  sensor_preference:
    - product_if_available_else_air
    - air_product_optional
    - product_required
    - air_only
  product_sensor_failure_policy:
    - fallback_to_air_after_timeout
    - wait_for_user
    - stop_to_safe_state
  completion_mode:
    - finish_without_cooling
    - cool_then_finish
    - cool_and_hold_for_duration
    - cool_and_hold_until_manual_stop

validation_limits:
  fermentation_temperature_c:
    min: 4
    max: 45
  fermentation_duration_min:
    min: 1
    max: 20160
  target_qualification_band_c:
    min: 0.1
    max: 2.0
  product_sensor_failure:
    fallback_delay_s:
      min: 0
      max: 3600
  cooling_target_c:
    min: 4
    max: 25
