[platformio]
default_envs = esp32dev
description = Sichere Firmware-Grundlage fuer den ESP32-Fermentationsschrank

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
lib_deps =
    ; Abhaengigkeiten projektspezifisch ergaenzen.

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wpedantic
