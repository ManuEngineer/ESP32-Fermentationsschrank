[platformio]
default_envs = native
description = Sichere Firmware-Grundlage fuer den ESP32-Fermentationsschrank

[profile]
build_flags =
    -std=gnu++17
    -DAPP_TARGET_FLASH_MB=4
    -DAPP_REQUIRE_PSRAM=0
    -DAPP_WEB_OTA_ENABLED=0
    -DAPP_REAL_ACTUATORS_ENABLED=0
native_warnings =
    -Wall
    -Wextra
    -Wpedantic
    -Werror

[env:native]
platform = native
test_framework = unity
build_flags =
    ${profile.build_flags}
    ${profile.native_warnings}
    -DAPP_PROFILE_NATIVE=1
    -DUNITY_INCLUDE_DOUBLE
