[platformio]
default_envs = native, esp32_bringup, esp32_release
description = Sichere Firmware-Grundlage fuer den ESP32-Fermentationsschrank

[profile]
build_flags =
    -std=gnu++17
    -DAPP_TARGET_FLASH_MB=4
    -DAPP_REQUIRE_PSRAM=0
    -DAPP_WEB_OTA_ENABLED=0
    -DAPP_REAL_ACTUATORS_ENABLED=0
native_warnings =
    -Wall
    -Wextra
    -Wpedantic
esp32_warnings =
    -Wall
    -Wextra

[env:native]
platform = native
test_framework = unity
build_flags =
    ${profile.build_flags}
    ${profile.native_warnings}
    -DAPP_PROFILE_NATIVE=1

[env:esp32_bringup]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 460800
build_unflags =
    -std=gnu++11
build_flags =
    ${profile.build_flags}
    -DAPP_PROFILE_ESP32_BRINGUP=1
build_src_flags =
    ${profile.esp32_warnings}

[env:esp32_release]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
upload_speed = 460800
build_unflags =
    -std=gnu++11
build_flags =
    ${profile.build_flags}
    -DAPP_PROFILE_ESP32_RELEASE=1
build_src_flags =
    ${profile.esp32_warnings}
