name: ESP-IDF + Native CI

on:
  push:
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04

    env:
      # Bei pull_request-Events checkt actions/checkout einen ephemeren
      # Merge-Commit aus; github.sha zeigt dann auf diese nicht im
      # sichtbaren PR-Commit-Verlauf vorkommende SHA. SOURCE_GIT_SHA
      # verwendet stattdessen den tatsaechlichen PR-Head-Commit fuer
      # Artefaktname und Manifest-Feld "git_sha" (bei push-Events sind
      # beide SHAs ohnehin identisch). Der tatsaechlich ausgecheckte und
      # gebaute Commit bleibt davon unabhaengig und wird im Ressourcen-
      # bericht separat als "Build-Commit" ausgegeben (build_report.py,
      # immer per `git rev-parse HEAD`) — beide Werte duerfen nicht
      # zusammengelegt werden.
      SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Python einrichten
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: PlatformIO fuer nativen Hostpfad installieren
        run: python -m pip install platformio==6.1.19

      - name: Format- und Analysewerkzeuge installieren (clang 18.1.8)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 clang-tidy-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy
          clang-format --version
          clang-tidy --version

      - name: Formatpruefung
        run: |
          clang-format --dry-run --Werror \
            $(find src include lib test main -type f \( -name "*.cpp" -o -name "*.hpp" -o -name "*.h" \))

      - name: Firmware bauen und Groessenbericht erzeugen
        run: |
          set -o pipefail
          python scripts/build_report.py --output build-report.md 2>&1 | tee platformio-build.log

      - name: Fehlgeschlagenen Buildlog sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platformio-build-log
          path: platformio-build.log
          if-no-files-found: ignore

      - name: Native Tests
        run: pio test -e native

      - name: Static Analysis (clang-tidy)
        run: |
          pio run -e native -t compiledb
          clang-tidy -p . \
            include/app_config.hpp \
            lib/device_platform/src/device_platform.cpp \
            lib/device_platform/src/virtual_time_source.cpp \
            lib/fermentation_app/src/fermentation_application.cpp \
            lib/fermentation_app/src/process_state_machine.cpp \
            lib/fermentation_app/src/program_model.cpp \
            lib/fermentation_app/src/run_commands.cpp \
            lib/fermentation_app/src/run_snapshot.cpp \
            lib/fermentation_app/src/standard_program_catalog.cpp \
            src/main.cpp

      - name: Architekturgrenzen pruefen
        run: python scripts/check_architecture_boundaries.py

      - name: Geheimnis- und Lokalkonfigurationspruefung
        run: python scripts/check_secrets.py

      - name: Qualitaetspruefungen gegen absichtlich fehlerhafte Faelle testen
        run: python scripts/selftest_quality_gates.py

      - name: ESP-IDF installieren (v6.0.2, exakter Commit)
        run: |
          set -euo pipefail

          export IDF_PATH="$RUNNER_TEMP/esp-idf-v6.0.2"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

          EXPECTED_TAG="v6.0.2"
          EXPECTED_COMMIT="7101770dc6db2667b3c477cc31365dd1acd6db4e"

          git clone --filter=blob:none --no-checkout \
            https://github.com/espressif/esp-idf.git \
            "$IDF_PATH"

          git -C "$IDF_PATH" fetch --depth 1 origin "$EXPECTED_COMMIT"
          git -C "$IDF_PATH" checkout --detach "$EXPECTED_COMMIT"
          git -C "$IDF_PATH" submodule update --init --recursive

          ACTUAL_TAG=$(git -C "$IDF_PATH" describe --tags --exact-match)
          if [ "$ACTUAL_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::falscher ESP-IDF-Tag: erwartet $EXPECTED_TAG, gefunden $ACTUAL_TAG"
            exit 1
          fi

          ACTUAL_COMMIT=$(git -C "$IDF_PATH" rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::error::falscher ESP-IDF-Commit: erwartet $EXPECTED_COMMIT, gefunden $ACTUAL_COMMIT"
            exit 1
          fi

          if [ -n "$(git -C "$IDF_PATH" status --short)" ]; then
            echo "::error::ESP-IDF-Arbeitsbaum ist nicht sauber"
            git -C "$IDF_PATH" status --short
            exit 1
          fi

          "$IDF_PATH/install.sh" esp32

      - name: ESP-IDF-Profile bauen (Bring-up und Release)
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"

          IDF_VERSION_OUTPUT=$(idf.py --version)
          echo "$IDF_VERSION_OUTPUT"
          case "$IDF_VERSION_OUTPUT" in
            *v6.0.2*) ;;
            *)
              echo "::error::idf.py --version meldet nicht v6.0.2: $IDF_VERSION_OUTPUT"
              exit 1
              ;;
          esac

          python scripts/build_esp_idf_profiles.py all

      - name: ESP-IDF-Ressourcenbericht ergaenzen (finaler Bericht)
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python scripts/build_report.py --output build-report.md --append \
            --esp-idf-profiles bringup release \
            --source-git-sha "$SOURCE_GIT_SHA"

      - name: esp-clang installieren (Static-Analysis-Toolchain)
        run: python "$IDF_PATH/tools/idf_tools.py" install esp-clang

      - name: ESP-IDF-Static-Analysis (esp-clang, beide Profile)
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          python scripts/run_esp_idf_static_analysis.py all

      - name: CI-Artefakt-Scanabdeckung pruefen
        run: python scripts/check_ci_artifact_scan_coverage.py

      - name: Secret- und Pfadpruefung generierter Artefakte
        run: |
          python scripts/check_secrets.py \
            --scan-path build-report.md \
            --scan-path build/esp32_bringup/artifact-manifest.json \
            --scan-path build/esp32_release/artifact-manifest.json \
            --scan-path build/esp32_bringup/build.log \
            --scan-path build/esp32_release/build.log \
            --scan-path build/esp32_bringup/sdkconfig \
            --scan-path build/esp32_release/sdkconfig \
            --scan-path build/esp32_bringup/compile_commands.json \
            --scan-path build/esp32_release/compile_commands.json \
            --scan-path build/esp32_bringup/size.json \
            --scan-path build/esp32_release/size.json \
            --scan-path build/esp32_bringup/flasher_args.json \
            --scan-path build/esp32_release/flasher_args.json \
            --scan-path build/esp32_bringup/esp32_fermentationsschrank.map \
            --scan-path build/esp32_release/esp32_fermentationsschrank.map

      - name: Groessenbericht sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-report
          path: build-report.md
          if-no-files-found: ignore

      - name: ESP-IDF-Bringup-Artefakte sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp-idf-esp32_bringup-${{ env.SOURCE_GIT_SHA }}
          path: |
            build/esp32_bringup/esp32_fermentationsschrank.bin
            build/esp32_bringup/esp32_fermentationsschrank.elf
            build/esp32_bringup/esp32_fermentationsschrank.map
            build/esp32_bringup/bootloader/bootloader.bin
            build/esp32_bringup/partition_table/partition-table.bin
            build/esp32_bringup/flasher_args.json
            build/esp32_bringup/sdkconfig
            build/esp32_bringup/compile_commands.json
            build/esp32_bringup/size.json
            build/esp32_bringup/build.log
            build/esp32_bringup/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: ESP-IDF-Release-Artefakte sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp-idf-esp32_release-${{ env.SOURCE_GIT_SHA }}
          path: |
            build/esp32_release/esp32_fermentationsschrank.bin
            build/esp32_release/esp32_fermentationsschrank.elf
            build/esp32_release/esp32_fermentationsschrank.map
            build/esp32_release/bootloader/bootloader.bin
            build/esp32_release/partition_table/partition-table.bin
            build/esp32_release/flasher_args.json
            build/esp32_release/sdkconfig
            build/esp32_release/compile_commands.json
            build/esp32_release/size.json
            build/esp32_release/build.log
            build/esp32_release/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
