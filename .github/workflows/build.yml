name: ESP-IDF + Native CI

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: firmware-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  firmware:
    # Draft-Pull-Requests erzeugen hoechstens einen sofort uebersprungenen
    # Workfloweintrag. Die schwere Vollpruefung startet erst nach dem
    # Ownerwechsel auf Ready for review und bei spaeteren semantischen Pushes
    # auf einen nicht mehr als Draft markierten PR.
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-24.04

    env:
      # Bei pull_request-Events checkt actions/checkout einen ephemeren
      # Merge-Commit aus; github.sha zeigt dann auf diese nicht im
      # sichtbaren PR-Commit-Verlauf vorkommende SHA. SOURCE_GIT_SHA
      # verwendet stattdessen den tatsaechlichen PR-Head-Commit fuer
      # Artefaktname und Manifest-Feld "git_sha". Der tatsaechlich
      # ausgecheckte und gebaute Commit bleibt davon unabhaengig und wird im
      # Ressourcenbericht separat als "Build-Commit" ausgegeben
      # (build_report.py, immer per `git rev-parse HEAD`) — beide Werte duerfen
      # nicht zusammengelegt werden.
      SOURCE_GIT_SHA: ${{ github.event.pull_request.head.sha }}
      # Kanonischer ESP-IDF-Pin (siehe ESP_IDF_UPGRADE_CONTRACT.md). Einmal
      # definiert und von Cache-Schluesseln sowie der Provenienzverifikation
      # unten referenziert, statt inline dupliziert zu werden.
      ESP_IDF_TAG: v6.1
      ESP_IDF_COMMIT: fff9895c82d744c7237be8847347bdd1b07c6643

    steps:
      - name: Repository auschecken
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Python einrichten
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: PlatformIO fuer nativen Hostpfad installieren
        run: python3 -m pip install platformio==6.1.19

      - name: ESP-IDF-Checkout cachen
        id: cache-esp-idf-checkout
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/esp-idf-${{ env.ESP_IDF_TAG }}
          key: esp-idf-checkout-${{ env.ESP_IDF_COMMIT }}

      - name: ESP-IDF-Tools-Verzeichnis cachen
        id: cache-esp-idf-tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/espressif
          key: esp-idf-tools-${{ env.ESP_IDF_COMMIT }}-py${{ steps.setup-python.outputs.python-version }}-${{ runner.os }}-${{ runner.arch }}

      - name: ESP-IDF installieren (v6.1, exakter Commit)
        env:
          CHECKOUT_CACHE_HIT: ${{ steps.cache-esp-idf-checkout.outputs.cache-hit }}
          TOOLS_CACHE_HIT: ${{ steps.cache-esp-idf-tools.outputs.cache-hit }}
        run: |
          set -euo pipefail

          export IDF_PATH="$RUNNER_TEMP/esp-idf-$ESP_IDF_TAG"
          export IDF_TOOLS_PATH="$RUNNER_TEMP/espressif"
          echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> "$GITHUB_ENV"

          # Checkout: nur bei einem echten, exakt schluesselgebundenen
          # Cache-Treffer (keine restore-keys) und tatsaechlich vorhandenem
          # Verzeichnis wird der Clone/Fetch/Checkout/Submodule-Block
          # uebersprungen. Die Provenienzverifikation unten laeuft in jedem
          # Fall unveraendert und ersetzt den Cache-Treffer nicht.
          if [ "$CHECKOUT_CACHE_HIT" = "true" ] && [ -d "$IDF_PATH/.git" ]; then
            echo "Checkout-Cache-Treffer: Clone/Fetch/Checkout/Submodule werden uebersprungen."
          else
            git clone --filter=blob:none --no-checkout \
              https://github.com/espressif/esp-idf.git \
              "$IDF_PATH"

            git -C "$IDF_PATH" fetch --depth 1 origin "$ESP_IDF_COMMIT"
            git -C "$IDF_PATH" checkout --detach "$ESP_IDF_COMMIT"
            git -C "$IDF_PATH" submodule update --init --recursive
          fi

          ACTUAL_TAG=$(git -C "$IDF_PATH" describe --tags --exact-match)
          if [ "$ACTUAL_TAG" != "$ESP_IDF_TAG" ]; then
            echo "::error::falscher ESP-IDF-Tag: erwartet $ESP_IDF_TAG, gefunden $ACTUAL_TAG"
            exit 1
          fi

          ACTUAL_COMMIT=$(git -C "$IDF_PATH" rev-parse HEAD)
          if [ "$ACTUAL_COMMIT" != "$ESP_IDF_COMMIT" ]; then
            echo "::error::falscher ESP-IDF-Commit: erwartet $ESP_IDF_COMMIT, gefunden $ACTUAL_COMMIT"
            exit 1
          fi

          if [ -n "$(git -C "$IDF_PATH" status --short)" ]; then
            echo "::error::ESP-IDF-Arbeitsbaum ist nicht sauber"
            git -C "$IDF_PATH" status --short
            exit 1
          fi

          # install.sh: nur bei einem echten Tools-Cache-Treffer
          # uebersprungen; ein Checkout-Hit allein reicht dafuer nicht, da
          # beide Caches unabhaengig ausfallen koennen.
          if [ "$TOOLS_CACHE_HIT" = "true" ]; then
            echo "Tools-Cache-Treffer: install.sh esp32 wird uebersprungen."
          else
            "$IDF_PATH/install.sh" esp32
          fi

      - name: ESP-clang fuer Host- und ESP-Phase bereitstellen
        env:
          TOOLS_CACHE_HIT: ${{ steps.cache-esp-idf-tools.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$TOOLS_CACHE_HIT" = "true" ]; then
            echo "Tools-Cache-Treffer: erneute esp-clang-Installation wird uebersprungen."
          else
            python3 "$IDF_PATH/tools/idf_tools.py" install esp-clang
          fi
          ESP_CLANG_TOOL_VERSION=$(python3 -c 'from scripts.esp_idf_contract import ESP_CLANG_TOOL_VERSION; print(ESP_CLANG_TOOL_VERSION)')
          ESP_CLANG_BIN="$IDF_TOOLS_PATH/tools/esp-clang/$ESP_CLANG_TOOL_VERSION/esp-clang/bin"
          test -x "$ESP_CLANG_BIN/clang-format"
          test -x "$ESP_CLANG_BIN/clang-tidy"
          echo "$ESP_CLANG_BIN" >> "$GITHUB_PATH"
          "$ESP_CLANG_BIN/clang-format" --version
          "$ESP_CLANG_BIN/clang-tidy" --version

      - name: Gemeinsame Gateausfuehrung (Host)
        run: |
          set -o pipefail
          export PRE_READY_EXPECTED_HEAD="$(git rev-parse HEAD)"
          echo "PRE_READY_EXPECTED_HEAD=$PRE_READY_EXPECTED_HEAD" >> "$GITHUB_ENV"
          bash scripts/run_pre_ready_gates.sh host

      - name: Gemeinsame Gateausfuehrung (ESP-IDF)
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          bash scripts/run_pre_ready_gates.sh esp

      - name: Fehlgeschlagenen Buildlog sichern
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platformio-build-log
          path: platformio-build.log
          if-no-files-found: ignore

      - name: GitHub-CI-Artefakt- und Datenschutzpruefung
        run: |
          set -euo pipefail
          python3 scripts/check_ci_artifact_scan_coverage.py
          python3 scripts/check_secrets.py \
            --scan-path build-report.md \
            --scan-path build/esp32_bringup/artifact-manifest.json \
            --scan-path build/esp32_release/artifact-manifest.json \
            --scan-path build/esp32_bringup/build.log \
            --scan-path build/esp32_release/build.log \
            --scan-path build/esp32_bringup/sdkconfig \
            --scan-path build/esp32_release/sdkconfig \
            --scan-path build/esp32_bringup/compile_commands.json \
            --scan-path build/esp32_release/compile_commands.json \
            --scan-path build/esp32_bringup/size.json \
            --scan-path build/esp32_release/size.json \
            --scan-path build/esp32_bringup/flasher_args.json \
            --scan-path build/esp32_release/flasher_args.json \
            --scan-path build/esp32_bringup/esp32_fermentationsschrank.map \
            --scan-path build/esp32_release/esp32_fermentationsschrank.map

      - name: Groessenbericht sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-report
          path: build-report.md
          if-no-files-found: ignore

      - name: ESP-IDF-Bringup-Artefakte sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp-idf-esp32_bringup-${{ env.SOURCE_GIT_SHA }}
          path: |
            build/esp32_bringup/esp32_fermentationsschrank.bin
            build/esp32_bringup/esp32_fermentationsschrank.elf
            build/esp32_bringup/esp32_fermentationsschrank.map
            build/esp32_bringup/bootloader/bootloader.bin
            build/esp32_bringup/partition_table/partition-table.bin
            build/esp32_bringup/flasher_args.json
            build/esp32_bringup/sdkconfig
            build/esp32_bringup/compile_commands.json
            build/esp32_bringup/size.json
            build/esp32_bringup/build.log
            build/esp32_bringup/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: ESP-IDF-Release-Artefakte sichern
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: esp-idf-esp32_release-${{ env.SOURCE_GIT_SHA }}
          path: |
            build/esp32_release/esp32_fermentationsschrank.bin
            build/esp32_release/esp32_fermentationsschrank.elf
            build/esp32_release/esp32_fermentationsschrank.map
            build/esp32_release/bootloader/bootloader.bin
            build/esp32_release/partition_table/partition-table.bin
            build/esp32_release/flasher_args.json
            build/esp32_release/sdkconfig
            build/esp32_release/compile_commands.json
            build/esp32_release/size.json
            build/esp32_release/build.log
            build/esp32_release/artifact-manifest.json
          if-no-files-found: error
          retention-days: 30
