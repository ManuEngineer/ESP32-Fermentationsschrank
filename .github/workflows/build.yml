name: PlatformIO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: PlatformIO installieren
        run: python -m pip install --upgrade platformio

      - name: Firmware bauen
        run: pio run -e native -e esp32_bringup -e esp32_release

      - name: Native Tests
        run: pio test -e native
