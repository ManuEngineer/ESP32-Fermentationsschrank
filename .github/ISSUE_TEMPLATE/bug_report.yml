name: Fehlerbericht
description: Reproduzierbaren Firmware- oder Hardwarefehler erfassen
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduktion
      description: Exakte Schritte zur Reproduktion
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmwarestand
      placeholder: Commit SHA oder Version

  - type: input
    id: hardware
    attributes:
      label: Hardwarestand
      placeholder: Boardrevision und relevante Komponenten

  - type: textarea
    id: logs
    attributes:
      label: Logs und Messwerte
      render: text

  - type: checkboxes
    id: safety
    attributes:
      label: Sicherheitsstatus
      options:
        - label: Das Geraet wurde bei unsicherem Verhalten spannungsfrei geschaltet.
