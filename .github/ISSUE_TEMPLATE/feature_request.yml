name: Funktionswunsch
description: Eine neue Funktion oder Verbesserung planen
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem oder Bedarf
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Gewuenschte Loesung
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      placeholder: |
        - [ ] ...
        - [ ] ...
